[project]
name = "truth-gate"
version = "0.1.0"
description = "Check an AI-written document against a facts file: every number must trace to a fact with matching context, every skill must be listed, blocked phrases fail, and a tone lint flags machine phrasing."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hossam Afifi" }]
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[project.urls]
Repository = "https://github.com/AfifiNL/truth-gate"

[project.scripts]
truth-gate = "truth_gate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20261103",
]
live = [
    "google-genai>=3.0.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truth_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["SIM905"]  # word lists read better as one string

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "RUF001", "RUF003"]  # en dashes, Arabic and Dutch text are the input under test
"evals/**" = ["RUF001", "RUF003"]  # localised example text

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["truth_gate"]
mypy_path = "src"
